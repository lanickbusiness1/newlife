version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /services/mcp-server
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /services/mcp-server
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/afria-recruit-investor-demo
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
