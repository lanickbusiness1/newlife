name: TEST-HEALTH-001 Live Media Extraction

on:
  push:
    branches:
      - chore/reel-reader-deploy-proof
    paths:
      - '.github/workflows/test-health-001-live-media.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/reel-reader-deploy-proof
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install resolver runtime
        run: pip install 'httpx>=0.28,<1'

      - name: Install bounded media tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Execute canonical resolver against real tweet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/test-health-001
          PYTHONPATH=apps/afria-reel-intelligence-reader/backend python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from resolver import resolve_x_media

          url = "https://x.com/Blessinghls/status/2101019521947451594"
          result = asyncio.run(resolve_x_media(url))
          Path("evidence/test-health-001/resolver-result.json").write_text(
              json.dumps(result, indent=2), encoding="utf-8"
          )
          print("LIVE_RESOLVER_RESULT=" + json.dumps(result, separators=(",", ":")))
          PY

      - name: Download resolved media and extract representative frames
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys, urllib.request
          from urllib.parse import urlparse

          root = pathlib.Path("evidence/test-health-001")
          result = json.loads((root / "resolver-result.json").read_text())
          candidates = result.get("media_candidates", [])
          print("MEDIA_STATE=" + str(result.get("media_state")))
          print("MEDIA_CANDIDATE_COUNT=" + str(len(candidates)))

          video = next((u for u in candidates if "video.twimg.com" in urlparse(u).netloc), None)
          images = [u for u in candidates if "pbs.twimg.com" in urlparse(u).netloc]

          if video:
              print("VIDEO_CANDIDATE_PRESENT=true")
              req = urllib.request.Request(video, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = resp.read(100 * 1024 * 1024 + 1)
              if len(data) > 100 * 1024 * 1024:
                  raise RuntimeError("video_exceeds_100mb_bound")
              media = root / "source-video.mp4"
              media.write_bytes(data)
              print("VIDEO_BYTES=" + str(len(data)))

              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=noprint_wrappers=1:nokey=1", str(media)],
                  text=True, capture_output=True, check=True
              )
              duration = float(probe.stdout.strip())
              print(f"VIDEO_DURATION_SECONDS={duration:.3f}")
              (root / "media-metadata.json").write_text(
                  json.dumps({"duration_seconds": duration, "source_video_url": video}, indent=2)
              )

              frames = root / "frames"
              frames.mkdir(exist_ok=True)
              subprocess.run(
                  ["ffmpeg", "-y", "-i", str(media), "-vf",
                   "fps=1/3,scale='min(960,iw)':-2", "-frames:v", "20",
                   str(frames / "frame-%03d.jpg")],
                  check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              )
              frame_count = len(list(frames.glob("*.jpg")))
              print("EXTRACTED_FRAME_COUNT=" + str(frame_count))

              audio = root / "audio.wav"
              audio_run = subprocess.run(
                  ["ffmpeg", "-y", "-i", str(media), "-vn", "-ac", "1", "-ar", "16000", str(audio)],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              )
              if audio_run.returncode == 0 and audio.exists() and audio.stat().st_size > 44:
                  print("AUDIO_TRACK_PRESENT=true")
                  print("AUDIO_BYTES=" + str(audio.stat().st_size))
              else:
                  print("AUDIO_TRACK_PRESENT=false")
                  if audio.exists():
                      audio.unlink()
          else:
              print("VIDEO_CANDIDATE_PRESENT=false")

          for idx, url in enumerate(images[:8], 1):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read(15 * 1024 * 1024 + 1)
                  if len(data) <= 15 * 1024 * 1024:
                      (root / f"image-{idx:02d}.jpg").write_bytes(data)
              except Exception as exc:
                  print(f"IMAGE_DOWNLOAD_ERROR_{idx}={type(exc).__name__}")

      - name: Keep bounded evidence only
        shell: bash
        run: |
          set -euo pipefail
          # Do not commit the full source video/audio. Keep provenance + representative frames.
          rm -f evidence/test-health-001/source-video.mp4 evidence/test-health-001/audio.wav
          find evidence/test-health-001 -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Commit evidence snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- evidence/test-health-001 && [ -z "$(git ls-files --others --exclude-standard evidence/test-health-001)" ]; then
            echo "NO_NEW_EVIDENCE"
            exit 0
          fi
          git config user.name "afrIAgenesis EvidenceBot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/test-health-001
          git commit -m "evidence(reel-reader): capture TEST-HEALTH-001 live media proof"
          git push origin HEAD:chore/reel-reader-deploy-proof
