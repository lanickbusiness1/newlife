name: AfrIA Industrial Proof
on:
  push:
    paths:
      - 'apps/afria-industrial/**'
      - 'docs/superpowers/specs/2026-09-01-afria-industrial-intelligence-automation-os-v1-design.md'
      - 'docs/superpowers/plans/2026-09-01-afria-industrial-intelligence-automation-os-v1-reviewed.md'
  pull_request:
    paths:
      - 'apps/afria-industrial/**'
      - 'docs/superpowers/specs/2026-09-01-afria-industrial-intelligence-automation-os-v1-design.md'
      - 'docs/superpowers/plans/2026-09-01-afria-industrial-intelligence-automation-os-v1-reviewed.md'
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/afria-industrial/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/afria-industrial/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prohibit machine actuation paths
        run: |
          ! grep -RniE 'def (write|actuate|command)|/write|/actuate|/command|/plc/set|/pac/set' apps/afria-industrial/backend/app
      - name: Prohibit committed raw proof secrets
        run: |
          ! grep -RniE 'engineer-secret|operator-secret|viewer-secret|sk-[A-Za-z0-9]' apps/afria-industrial --exclude='*.md' --exclude='test_*.py'
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, safety]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t afria-industrial-backend:proof apps/afria-industrial/backend
      - run: docker build -t afria-industrial-frontend:proof apps/afria-industrial/frontend
      - run: docker compose -f apps/afria-industrial/docker-compose.yml --env-file apps/afria-industrial/.env.example config >/dev/null
