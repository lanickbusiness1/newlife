name: Genesis Veille World State CI

on:
  push:
    branches:
      - feature/genesis-veille-world-state-v1
    paths:
      - 'apps/genesis-veille-engine/**'
      - '.github/workflows/genesis-veille-world-state.yml'
  pull_request:
    paths:
      - 'apps/genesis-veille-engine/**'
      - '.github/workflows/genesis-veille-world-state.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/genesis-veille-engine/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/genesis-veille-engine/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
