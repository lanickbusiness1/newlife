name: Genesis Veille World State CI

on:
  push:
    branches:
      - feature/genesis-veille-world-state-v1
    paths:
      - 'apps/genesis-veille-engine/**'
      - '.github/workflows/genesis-veille-world-state.yml'
  pull_request:
    paths:
      - 'apps/genesis-veille-engine/**'
      - '.github/workflows/genesis-veille-world-state.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/genesis-veille-engine/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/genesis-veille-engine/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container
        working-directory: apps/genesis-veille-engine
        run: docker build -t genesis-veille-world-state:ci .

      - name: Boot container
        run: docker run -d --rm --name genesis-veille-smoke -p 8000:8000 genesis-veille-world-state:ci

      - name: Verify health and public shell
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'Genesis Veille — Africa World State'

      - name: Container logs on failure
        if: failure()
        run: docker logs genesis-veille-smoke || true

      - name: Stop container
        if: always()
        run: docker stop genesis-veille-smoke || true
