name: World Cup 2030 Release Candidate

on:
  push:
    branches:
      - recovery/world-cup-2030-supporter
    paths:
      - "experience/world-cup-2030-supporter-recovery/**"
      - ".github/workflows/world-cup-2030-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-release-candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experience/world-cup-2030-supporter-recovery
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit and GENESIS checks
        run: |
          npm test
          npm run check

      - name: Build release candidate
        run: npm run build:release

      - name: Verify release candidate
        run: npm run verify:release

      - name: Package exact runtime bytes
        run: |
          mkdir -p release
          tar -C dist -czf release/supporter-2030-rc.tar.gz .
          sha256sum release/supporter-2030-rc.tar.gz > release/supporter-2030-rc.tar.gz.sha256
          cp dist/release-manifest.json release/release-manifest.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: supporter-2030-rc-${{ github.sha }}
          path: experience/world-cup-2030-supporter-recovery/release/
          if-no-files-found: error
          retention-days: 14
