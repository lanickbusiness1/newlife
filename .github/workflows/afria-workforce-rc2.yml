name: AfrIA Workforce RC2

on:
  pull_request:
    paths:
      - 'apps/afria-workforce-intelligence/backend/**'
      - '.github/workflows/afria-workforce-rc2.yml'
  push:
    branches:
      - feature/afria-workforce-intelligence-rc2
    paths:
      - 'apps/afria-workforce-intelligence/backend/**'
      - '.github/workflows/afria-workforce-rc2.yml'

jobs:
  proof-of-life:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/afria-workforce-intelligence/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
