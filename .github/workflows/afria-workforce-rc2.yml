name: AfrIA Workforce RC2

on:
  pull_request:
    paths:
      - 'apps/afria-workforce-intelligence/backend/**'
      - '.github/workflows/afria-workforce-rc2.yml'
  push:
    branches:
      - feature/afria-workforce-intelligence-rc2
      - feature/mining-local-content-module-06
    paths:
      - 'apps/afria-workforce-intelligence/backend/**'
      - '.github/workflows/afria-workforce-rc2.yml'

jobs:
  proof-of-life:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workforce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workforce_test
    defaults:
      run:
        working-directory: apps/afria-workforce-intelligence/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply sovereign database migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/001_living_core.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/002_mining_local_content.sql
