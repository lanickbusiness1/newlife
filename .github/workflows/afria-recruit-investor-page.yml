name: AfrIA Recruit Investor Page

on:
  push:
    paths:
      - 'docs/afria-recruit-investor/**'
      - '.github/workflows/afria-recruit-investor-page.yml'
  pull_request:
    paths:
      - 'docs/afria-recruit-investor/**'

jobs:
  investor-page-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/afria-recruit-investor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start static site
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/afria-investor-page.log 2>&1 &
      - name: Run privacy and interaction tests
        run: npm run test:e2e
