name: AfrIA Recruit Investor Page

on:
  push:
    paths:
      - 'docs/afria-recruit-investor/**'
      - '.github/workflows/afria-recruit-investor-page.yml'
  pull_request:
    paths:
      - 'docs/afria-recruit-investor/**'

concurrency:
  group: afria-recruit-investor-page
  cancel-in-progress: true

jobs:
  investor-page-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/afria-recruit-investor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Run privacy and interaction tests
        run: npm run test:e2e
