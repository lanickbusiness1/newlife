name: V4-DEC-035 IP-to-Capital Gate CI

on:
  pull_request:
    paths:
      - 'services/mcp-server/**'
      - '.github/workflows/v4-dec-035-ip-to-capital-gate-ci.yml'

permissions:
  contents: read

concurrency:
  group: v4-dec-035-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/mcp-server/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Security audit diagnostic — global merge blocker remains authoritative in MCP CI
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npx vitest run tests/ipToCapitalReadinessGate.test.ts
      - run: npm test
      - run: npm run build
