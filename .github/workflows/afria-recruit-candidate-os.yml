name: AfrIA Recruit Candidate OS

on:
  push:
    branches:
      - feat/afria-recruit-candidate-os-v1
    paths:
      - 'apps/afria-recruit/**'
      - '.github/workflows/afria-recruit-candidate-os.yml'
  pull_request:
    paths:
      - 'apps/afria-recruit/**'
      - '.github/workflows/afria-recruit-candidate-os.yml'

permissions:
  contents: write

concurrency:
  group: afria-recruit-candidate-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/afria-recruit
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.x'
      - name: Install dependencies for bootstrap
        run: npm install --ignore-scripts
      - name: Canonicalize generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/afria-recruit-candidate-os-v1'
        working-directory: .
        run: |
          if git diff --quiet -- apps/afria-recruit/package-lock.json && git ls-files --error-unmatch apps/afria-recruit/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/afria-recruit/package-lock.json
          git commit -m 'build(afria-recruit): lock Candidate OS dependencies'
          git push origin HEAD:feat/afria-recruit-candidate-os-v1
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run unit tests
        run: npm run test:unit
      - name: Typecheck
        run: npm run typecheck
      - name: Build production artifact
        run: npm run build
      - name: Scan browser artifact
        run: npm run scan:build
