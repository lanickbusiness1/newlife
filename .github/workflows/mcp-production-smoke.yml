name: MCP Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'services/mcp-server/**'
      - 'render.yaml'
      - '.github/workflows/mcp-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Render production health, EDUA artifact and outcome loop
        shell: bash
        env:
          BASE_URL: https://afriagenesis-intelligence-mcp.onrender.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            health="$(curl -fsS --connect-timeout 5 --max-time 20 "$BASE_URL/health" || true)"
            demo="$(curl -fsS --connect-timeout 5 --max-time 20 "$BASE_URL/demo/edua/photosynthesis" || true)"
            outcome="$(curl -fsS --connect-timeout 5 --max-time 20               -H 'content-type: application/json'               -d '{"learnerSessionId":"smoke-anonymous","representationEventId":"repr-smoke","preScore":40,"postScore":80,"interactions":3,"evidenceRefs":["smoke:ci"]}'               "$BASE_URL/api/edua/outcome" || true)"

            if printf '%s' "$health" | grep -q '"status":"ok"'               && printf '%s' "$health" | grep -q '"sovereignCommsControlPlane":"CAP-SAW-COMMS-001"'               && printf '%s' "$health" | grep -q '"eduaInteractiveArtifact":"EDUA-ART-PHOTOSYNTHESIS-001"'               && printf '%s' "$demo" | grep -q 'id="photosynthesis-rate"'               && printf '%s' "$demo" | grep -q 'INTERACTIVE_DEMO_ARTIFACT'               && printf '%s' "$outcome" | grep -q '"status":"measured"'               && printf '%s' "$outcome" | grep -q '"status":"candidate_only"'; then
              echo "PRODUCTION_PROVEN: health + EDUA interactive artifact + bounded outcome loop observed."
              exit 0
            fi

            echo "Attempt $attempt/40: deployment not yet proven; retrying in 15s"
            sleep 15
          done

          echo "Production smoke evidence not obtained within the bounded retry window."
          exit 1
