name: MCP Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'services/mcp-server/**'
      - 'render.yaml'
      - '.github/workflows/mcp-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.contract.outputs.configured }}
    steps:
      - name: Resolve canonical production endpoint contract
        id: contract
        env:
          BASE_URL: ${{ vars.MCP_PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production endpoint unset::MCP_PRODUCTION_BASE_URL is not canonically configured. Production smoke is intentionally skipped; PRODUCTION_PROVEN remains closed."
          else
            case "$BASE_URL" in
              https://*) ;;
              *) echo "::error title=Invalid production endpoint::MCP_PRODUCTION_BASE_URL must use HTTPS."; exit 1 ;;
            esac
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Canonical production endpoint contract is configured."
          fi

  smoke:
    needs: provider-contract
    if: needs.provider-contract.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify canonical production health, EDUA artifact and outcome loop
        shell: bash
        env:
          BASE_URL: ${{ vars.MCP_PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          for attempt in $(seq 1 24); do
            health="$(curl -fsS --connect-timeout 5 --max-time 20 "$base/health" || true)"
            demo="$(curl -fsS --connect-timeout 5 --max-time 20 "$base/demo/edua/photosynthesis" || true)"
            outcome="$(curl -fsS --connect-timeout 5 --max-time 20               -H 'content-type: application/json'               -d '{"learnerSessionId":"smoke-anonymous","representationEventId":"repr-smoke","preScore":40,"postScore":80,"interactions":3,"evidenceRefs":["smoke:ci"]}'               "$base/api/edua/outcome" || true)"

            if printf '%s' "$health" | grep -q '"status":"ok"'               && printf '%s' "$health" | grep -q '"sovereignCommsControlPlane":"CAP-SAW-COMMS-001"'               && printf '%s' "$health" | grep -q '"eduaInteractiveArtifact":"EDUA-ART-PHOTOSYNTHESIS-001"'               && printf '%s' "$health" | grep -q '"representationCompilerProfile":"GEN-COMPILER-PROFILE-REPRESENTATION-001"'               && printf '%s' "$health" | grep -q '"representationEvidenceAdapter":"GEN-REP-EVIDENCE-ADAPTER-001"'               && printf '%s' "$health" | grep -q '"openAICapabilityRegistryVersion":"2026-09-20"'               && printf '%s' "$demo" | grep -q 'id="photosynthesis-rate"'               && printf '%s' "$demo" | grep -q 'INTERACTIVE_DEMO_ARTIFACT'               && printf '%s' "$outcome" | grep -q '"status":"measured"'               && printf '%s' "$outcome" | grep -q '"status":"candidate_only"'; then
              echo "PRODUCTION_PROVEN: canonical endpoint + health + EDUA interactive artifact + bounded outcome loop observed."
              exit 0
            fi

            echo "Attempt $attempt/24: canonical provider not yet proven; retrying in 15s"
            sleep 15
          done

          echo "Production smoke evidence not obtained within the bounded retry window."
          exit 1
