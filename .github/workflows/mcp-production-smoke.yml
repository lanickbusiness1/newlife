name: MCP Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'services/mcp-server/**'
      - 'render.yaml'
      - '.github/workflows/mcp-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Render production health and sovereign comms capability
        shell: bash
        env:
          HEALTH_URL: https://afriagenesis-intelligence-mcp.onrender.com/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            body="$(curl -fsS --connect-timeout 5 --max-time 20 "$HEALTH_URL" || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"' \
              && printf '%s' "$body" | grep -q '"sovereignCommsControlPlane":"CAP-SAW-COMMS-001"'; then
              echo "PRODUCTION_PROVEN: $body"
              exit 0
            fi
            echo "Attempt $attempt/40: deployment not yet proven; retrying in 15s"
            sleep 15
          done
          echo "Production smoke evidence not obtained within the bounded retry window."
          exit 1
