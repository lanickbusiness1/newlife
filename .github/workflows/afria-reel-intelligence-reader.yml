name: AfrIA Reel Intelligence Reader

on:
  pull_request:
    paths:
      - 'apps/afria-reel-intelligence-reader/**'
      - '.github/workflows/afria-reel-intelligence-reader.yml'
  push:
    branches: [main]
    paths:
      - 'apps/afria-reel-intelligence-reader/**'
      - '.github/workflows/afria-reel-intelligence-reader.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/afria-reel-intelligence-reader/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall main.py
      - run: python -m pytest -q
