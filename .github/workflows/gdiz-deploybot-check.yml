name: GDIZ DeployBot Check

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/gdiz-deploybot-check.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/gdiz-deploybot-check.yml"

permissions:
  contents: read

concurrency:
  group: gdiz-deploybot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploybot-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run release-contract tests
        run: npm test

      - name: Type-check application
        run: npm run typecheck

      - name: Run DeployBot readiness check
        run: npm run deploybot:check

      - name: Build project
        run: npm run build
