name: GDIZ DeployBot Check

on:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/gdiz-deploybot-check.yml"
  pull_request:
    paths:
      - "apps/web/**"

jobs:
  deploybot-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run DeployBot readiness check
        run: npm run deploybot:check

      - name: Build project
        run: npm run build
