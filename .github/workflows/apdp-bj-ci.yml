name: APDP BJ CI

on:
  pull_request:
    paths:
      - 'products/apdp-bj/**'
      - '.github/workflows/apdp-bj-ci.yml'
  push:
    branches:
      - apdp-bj-foundation
    paths:
      - 'products/apdp-bj/**'
      - '.github/workflows/apdp-bj-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/apdp-bj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -t apdp-bj:${{ github.sha }} .
