name: APDP BJ CI

on:
  pull_request:
    paths:
      - 'products/apdp-bj/**'
      - '.github/workflows/apdp-bj-ci.yml'
  push:
    branches:
      - apdp-bj-foundation
    paths:
      - 'products/apdp-bj/**'
      - '.github/workflows/apdp-bj-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://apdp:apdp@127.0.0.1:5432/apdp
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      PORT: '3001'
      HOST: 127.0.0.1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apdp
          POSTGRES_PASSWORD: apdp
          POSTGRES_DB: apdp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apdp -d apdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: products/apdp-bj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Build API and cockpit
        run: npm run build
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply canonical migrations
        run: |
          for migration in packages/db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify schema and security seeds
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from roles;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from permissions;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from role_permissions;"
      - name: Seed deterministic CI identities
        run: npm run seed:ci
      - name: Start API and cockpit
        run: |
          npm run start:api > /tmp/apdp-bj-api.log 2>&1 &
          echo $! > /tmp/apdp-bj-api.pid
      - name: Wait for API health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/apdp-bj-api.log
          exit 1
      - name: Verify cockpit delivery
        run: |
          curl -fsS http://127.0.0.1:3001/ | grep -q "APDP BJ"
      - name: Execute backend vertical slice
        run: npm run smoke:e2e
      - name: Build production image
        run: docker build -t apdp-bj:${{ github.sha }} .
      - name: Print API logs on failure
        if: failure()
        run: cat /tmp/apdp-bj-api.log || true
