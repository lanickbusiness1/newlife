name: AfrIA Recruit Canonical Release

on:
  pull_request:
    paths:
      - 'apps/afria-recruit-investor-demo/**'
      - 'apps/startup-accelerator-genome/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - '.github/workflows/afria-recruit-release.yml'
  push:
    branches: [main]
    paths:
      - 'apps/afria-recruit-investor-demo/**'
      - 'apps/startup-accelerator-genome/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - '.github/workflows/afria-recruit-release.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Force deployment after the repository Pages site has been activated
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: read

concurrency:
  group: afria-recruit-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact public artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    defaults:
      run:
        working-directory: apps/afria-recruit-investor-demo
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/afria-recruit-investor-demo/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run unit and release-contract tests
        run: npm test

      - name: Build production artifact
        run: npm run build

      - name: Record exact artifact digests
        run: find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/dist-before-e2e.sha256

      - name: Install Chromium for browser proof
        run: npx playwright install --with-deps chromium

      - name: Run browser proof against the production artifact
        run: npm run test:e2e

      - name: Prove browser tests did not mutate the artifact
        run: |
          find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/dist-after-e2e.sha256
          diff --unified /tmp/dist-before-e2e.sha256 /tmp/dist-after-e2e.sha256

      - name: Reject secrets, fabricated claims and source maps
        run: npm run scan:bundle

      - name: Package the only repository Pages artifact
        working-directory: .
        run: >-
          node apps/afria-recruit-investor-demo/scripts/package-pages.mjs
          apps/afria-recruit-investor-demo/dist
          apps/startup-accelerator-genome/index.html
          public-site
          "$GITHUB_SHA"

      - name: Scan the complete Pages artifact
        working-directory: .
        run: node apps/afria-recruit-investor-demo/scripts/scan-public-bundle.mjs public-site

      - name: Verify packaged entry points
        working-directory: .
        run: |
          test -s public-site/index.html
          test -s public-site/release.json
          test -s public-site/startup-accelerator/index.html

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-site
          retention-days: 30

      - name: Detect an activated Pages site
        id: pages
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output /tmp/pages-status.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"
          case "$status" in
            200) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'enabled=false' >> "$GITHUB_OUTPUT" ;;
            *) cat /tmp/pages-status.json; exit 1 ;;
          esac

  deploy:
    name: Deploy verified artifact
    needs: verify
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        (
          needs.verify.outputs.pages_enabled == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    name: Prove public release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Recruit, manifest and preserved Accelerator
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$base/" --output /tmp/recruit.html \
              && grep --quiet 'AfrIA Recruit' /tmp/recruit.html \
              && curl --fail --silent --show-error --location "$base/release.json" --output /tmp/release.json \
              && curl --fail --silent --show-error --location "$base/startup-accelerator/" --output /tmp/accelerator.html \
              && grep --quiet 'Startup Accelerator' /tmp/accelerator.html \
              && RELEASE_FILE=/tmp/release.json node --input-type=module --eval \
                "import { readFileSync } from 'node:fs'; const release = JSON.parse(readFileSync(process.env.RELEASE_FILE)); if (release.sha !== process.env.EXPECTED_SHA) process.exit(1)"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
