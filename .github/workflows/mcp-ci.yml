name: MCP CI
on:
  push:
    branches: [main]
    paths:
      - 'services/mcp-server/**'
      - 'render.yaml'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'services/mcp-server/**'
      - 'render.yaml'
      - '.github/workflows/mcp-ci.yml'

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/mcp-server/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-diagnostics
          path: services/mcp-server/typecheck.log
      - run: npm test
      - name: Build
        run: npm run build 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-diagnostics
          path: services/mcp-server/build.log
      # Security remains fail-closed. It runs after quality checks so the CI record
      # preserves test/build evidence even when a dependency advisory vetoes release.
      - run: npm audit --audit-level=high
