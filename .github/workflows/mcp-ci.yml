name: MCP CI
on:
  push:
    branches: [main]
    paths:
      - 'services/mcp-server/**'
      - 'render.yaml'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'services/mcp-server/**'
      - 'render.yaml'
      - '.github/workflows/mcp-ci.yml'

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/mcp-server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke:mcp
      - name: Build MCP Docker image
        run: docker build --tag afriagenesis-mcp:ci .
      - name: Run Skill Factory smoke inside Docker image
        run: docker run --rm afriagenesis-mcp:ci npm run smoke:mcp
      - name: Verify containerized MCP health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name afriagenesis-mcp-ci -p 10000:10000 afriagenesis-mcp:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/health > /tmp/mcp-health.json; then
              cat /tmp/mcp-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs afriagenesis-mcp-ci || true
          exit 1
      - name: Cleanup MCP container
        if: always()
        run: docker rm -f afriagenesis-mcp-ci >/dev/null 2>&1 || true
