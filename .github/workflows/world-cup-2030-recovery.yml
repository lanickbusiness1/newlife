name: World Cup 2030 Recovery Check

on:
  push:
    branches:
      - recovery/world-cup-2030-supporter
    paths:
      - "experience/world-cup-2030-supporter-recovery/**"
      - ".github/workflows/world-cup-2030-recovery.yml"
  pull_request:
    paths:
      - "experience/world-cup-2030-supporter-recovery/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experience/world-cup-2030-supporter-recovery
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: npm test

      - name: GENESIS recovery assertions
        run: npm run check
