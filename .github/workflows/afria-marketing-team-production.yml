name: AfrIA Marketing Team Production Product

on:
  pull_request:
    paths:
      - 'apps/afria-marketing-team/**'
      - 'docs/superpowers/specs/2026-08-19-afria-marketing-team-production-product-design.md'
      - 'docs/superpowers/plans/2026-08-19-afria-marketing-team-production-product.md'
      - '.github/workflows/afria-marketing-team-production.yml'
  push:
    branches:
      - afria-marketing-team-production-product
    paths:
      - 'apps/afria-marketing-team/**'
      - '.github/workflows/afria-marketing-team-production.yml'

jobs:
  verify-production-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Frontend install
        run: npm install
        working-directory: apps/afria-marketing-team/frontend
      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: apps/afria-marketing-team/frontend
      - name: Frontend tests
        run: npm test
        working-directory: apps/afria-marketing-team/frontend
      - name: Frontend build
        run: npm run build
        working-directory: apps/afria-marketing-team/frontend
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Backend install
        run: pip install -r requirements.txt
        working-directory: apps/afria-marketing-team/backend
      - name: Backend tests
        run: pytest -q
        working-directory: apps/afria-marketing-team/backend
      - name: Static production anchors
        run: |
          grep -R "PRD-MKT-TEAM-001" apps/afria-marketing-team
          grep -R "Production Product" apps/afria-marketing-team
          grep -R "PRODUCTION_REVENUE_READY=false" apps/afria-marketing-team
          grep -R "R.E.M.E" apps/afria-marketing-team
          grep -R "S7+" apps/afria-marketing-team
          grep -R "CyberAudit" apps/afria-marketing-team
