name: WhatsApp Revenue OS Live Demo Verification

on:
  pull_request:
    paths:
      - 'apps/whatsapp-revenue-os/**'
      - 'supabase/migrations/202609170001_whatsapp_revenue_os.sql'
      - 'docs/superpowers/specs/2026-09-16-whatsapp-revenue-os-live-demo-design.md'
      - 'docs/superpowers/plans/2026-09-17-whatsapp-revenue-os-live-demo.md'
      - '.github/workflows/whatsapp-revenue-os.yml'
  push:
    branches:
      - feat/whatsapp-revenue-os-live-demo
    paths:
      - 'apps/whatsapp-revenue-os/**'
      - 'supabase/migrations/202609170001_whatsapp_revenue_os.sql'
      - '.github/workflows/whatsapp-revenue-os.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: apps/whatsapp-revenue-os
      - name: Compile
        run: python -m compileall -q .
        working-directory: apps/whatsapp-revenue-os
      - name: Unit and API tests
        run: pytest -q
        working-directory: apps/whatsapp-revenue-os
      - name: Governance anchors
        run: |
          grep -R "PRD-WA-AGENT-FACTORY-001" apps/whatsapp-revenue-os
          grep -R "STOP" apps/whatsapp-revenue-os
          grep -R "OUTBOUND_KILL_SWITCH" apps/whatsapp-revenue-os
          grep -R "demo_ready.*False\|DEMO_READY=false\|not DEMO_READY" apps/whatsapp-revenue-os
      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn --exclude='.env.example' --exclude='*.md' \
            '(EAA[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' \
            apps/whatsapp-revenue-os supabase/migrations/202609170001_whatsapp_revenue_os.sql; then
            echo 'Potential secret-like token detected'
            exit 1
          fi
          echo 'No token-shaped secrets detected'
