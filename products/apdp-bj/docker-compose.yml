services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apdp_bj
      POSTGRES_USER: apdp
      POSTGRES_PASSWORD: apdp_local_only
    ports:
      - "5432:5432"
    volumes:
      - apdp_bj_db:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apdp -d apdp_bj"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://apdp:apdp_local_only@db:5432/apdp_bj
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  apdp_bj_db:
