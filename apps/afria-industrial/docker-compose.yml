services:
  backend:
    build: ./backend
    environment:
      AFRIA_INDUSTRIAL_API_KEYS: ${AFRIA_INDUSTRIAL_API_KEYS:?AFRIA_INDUSTRIAL_API_KEYS is required}
      AFRIA_INDUSTRIAL_CORS_ORIGINS: ${AFRIA_INDUSTRIAL_CORS_ORIGINS:-http://localhost:8080}
      AFRIA_INDUSTRIAL_DATABASE_PATH: /data/industrial.db
      AFRIA_INDUSTRIAL_MUTATION_RATE_LIMIT: ${AFRIA_INDUSTRIAL_MUTATION_RATE_LIMIT:-10}
      AFRIA_INDUSTRIAL_MUTATION_RATE_WINDOW_SECONDS: ${AFRIA_INDUSTRIAL_MUTATION_RATE_WINDOW_SECONDS:-60}
    volumes:
      - industrial-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    environment:
      AFRIA_INDUSTRIAL_API_BASE_URL: http://localhost:8000
      AFRIA_INDUSTRIAL_PROOF_API_KEY: ${AFRIA_INDUSTRIAL_FRONTEND_PROOF_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  industrial-data:
