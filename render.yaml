services:
  - type: web
    name: afriagenesis-intelligence-mcp
    runtime: docker
    plan: free
    autoDeploy: true
    rootDir: services/mcp-server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: NODE_ENV
        value: production
