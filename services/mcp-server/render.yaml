services:
  - type: web
    name: afriagenesis-intelligence-mcp
    runtime: docker
    plan: free
    autoDeploy: true
    rootDir: services/mcp-server
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: NODE_ENV
        value: production
      - key: GENESIS_CORRIDOR_SUPABASE_URL
        sync: false
      - key: GENESIS_CORRIDOR_SERVICE_ROLE_KEY
        sync: false
